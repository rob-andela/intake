const Gauge = ({ score }) => {
  const { dark } = useTheme();
  const band = getBand(score);
  const angle = (score / 100) * 180 - 90;
  return (
    <div style={{ textAlign: "center" }}>
      <svg viewBox="0 0 200 120" style={{ width: 220, height: 132 }}>
        <defs><linearGradient id="gg" x1="0%" x2="100%"><stop offset="0%" stopColor="#ef4444" /><stop offset="40%" stopColor="#f97316" /><stop offset="65%" stopColor="#22c55e" /><stop offset="100%" stopColor="#06b6d4" /></linearGradient></defs>
        <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke={t(dark, "#1e293b", "#e2e8f0")} strokeWidth="12" strokeLinecap="round" />
        <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="url(#gg)" strokeWidth="12" strokeLinecap="round" strokeDasharray={`${(score / 100) * 251.2} 251.2`} />
        <line x1="100" y1="100" x2={100 + 55 * Math.cos((angle * Math.PI) / 180)} y2={100 + 55 * Math.sin((angle * Math.PI) / 180)} stroke={t(dark, "#e2e8f0", "#1e293b")} strokeWidth="2.5" strokeLinecap="round" />
        <circle cx="100" cy="100" r="4" fill={t(dark, "#e2e8f0", "#1e293b")} />
        <text x="100" y="88" textAnchor="middle" fill={t(dark, "#f1f5f9", "#0f172a")} fontSize="26" fontWeight="800" fontFamily="'JetBrains Mono',monospace">{score}</text>
        <text x="100" y="116" textAnchor="middle" fill={band.color} fontSize="8" fontWeight="600" fontFamily="'JetBrains Mono',monospace" letterSpacing="0.1em">{band.label.toUpperCase()}</text>
      </svg>
    </div>
  );
};

const Multi = ({ options, selected, onChange }) => {
  const { dark } = useTheme();
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 4 }}>
      {options.map((o) => {
        const on = selected.includes(o);
        return <button key={o} onClick={() => onChange(on ? selected.filter((s) => s !== o) : [...selected, o])} style={{ padding: "6px 12px", borderRadius: 7, border: `1px solid ${on ? "#0ea5e9" : t(dark, "#1e293b", "#e2e8f0")}`, background: on ? "#0ea5e912" : "transparent", color: on ? "#0ea5e9" : t(dark, "#94a3b8", "#64748b"), fontSize: 12, cursor: "pointer" }}>{on && "✓ "}{o}</button>;
      })}
    </div>
  );
};

const Field = ({ f, value, onChange }) => {
  const { dark } = useTheme();
  const base = { width: "100%", padding: "10px 14px", borderRadius: 9, border: `1px solid ${t(dark, "#1e293b", "#d1d5db")}`, background: t(dark, "#0a0f1a", "#fff"), color: t(dark, "#e2e8f0", "#1e293b"), fontSize: 13, fontFamily: "'DM Sans',sans-serif", outline: "none", boxSizing: "border-box" };
  return (
    <div style={{ marginBottom: 16 }}>
      <label style={{ display: "block", marginBottom: 6, fontSize: 13, fontWeight: 500, color: t(dark, "#cbd5e1", "#374151"), lineHeight: 1.4 }}>{f.label}</label>
      {f.type === "textarea" && <textarea value={value || ""} onChange={(e) => onChange(e.target.value)} placeholder={f.ph} rows={2} style={{ ...base, resize: "vertical", minHeight: 60 }} />}
      {f.type === "text" && <input type="text" value={value || ""} onChange={(e) => onChange(e.target.value)} placeholder={f.ph} style={base} />}
      {f.type === "select" && <select value={value || ""} onChange={(e) => onChange(e.target.value)} style={{ ...base, cursor: "pointer" }}>{f.opts.map((o, i) => <option key={i} value={o}>{o || "— Select —"}</option>)}</select>}
      {f.type === "multi" && <Multi options={f.opts} selected={value || []} onChange={onChange} />}
    </div>
  );
};

      )}
    </div>
  );
};

// ─── MAIN APP ────────────────────────────────────────────────────────
function App() {
  const [dark, setDark] = useState(true);
  const [phase, setPhase] = useState(0);
  const [fd, setFd] = useState({});
  const [scores, setScores] = useState({ business: 0, technical: 0, delivery: 0, workforce: 0, economic: 0 });
  const [ci, setCi] = useState({ company: "", contact: "", email: "" });
  const [view, setView] = useState("form"); // form | summary
  const [submitted, setSubmitted] = useState(false);
  const [sidebar, setSidebar] = useState(true);
  const [activeScenario, setActiveScenario] = useState(null);
  const ref = useRef(null);

  const uf = useCallback((id, v) => setFd((p) => ({ ...p, [id]: v })), []);
  const us = useCallback((d, v) => setScores((p) => ({ ...p, [d]: v })), []);
  const nav = (i) => { setPhase(i); setView("form"); ref.current?.scrollTo(0, 0); };

  const loadScenario = useCallback((idx) => {
    if (idx === null) {
      setFd({});
      setScores({ business: 0, technical: 0, delivery: 0, workforce: 0, economic: 0 });
      setCi({ company: "", contact: "", email: "" });
      setActiveScenario(null);
      setSubmitted(false);
      setPhase(0);
      setView("form");
      ref.current?.scrollTo(0, 0);
      return;
    }
    const s = SAMPLES[idx];
    setFd({ ...s.form });
    setScores({ ...s.scores });
    setCi({ ...s.client });
    setActiveScenario(idx);
    setSubmitted(false);
    setPhase(0);
    setView("form");
    ref.current?.scrollTo(0, 0);
  }, []);

  const ri = calcRI(scores);
  const band = getBand(ri);
  const p = PHASES[phase];

  const cmap = {};
  PHASES.forEach((ph) => {
    let tot = 0, fill = 0;
    ph.sections.forEach((s) => s.fields.forEach((f) => { tot++; const v = fd[f.id]; if (v && (Array.isArray(v) ? v.length : v.length)) fill++; }));
    cmap[ph.id] = tot ? Math.round((fill / tot) * 100) : 0;
  });

  const bg = t(dark, "#050810", "#f8fafc");
  const bg2 = t(dark, "#080c16", "#ffffff");
  const bg3 = t(dark, "#0a0f1a", "#f1f5f9");
  const bdr = t(dark, "#1e293b", "#e2e8f0");
  const bdr2 = t(dark, "#111827", "#d1d5db");
  const txt = t(dark, "#f1f5f9", "#0f172a");
  const txt2 = t(dark, "#94a3b8", "#64748b");
  const txt3 = t(dark, "#475569", "#9ca3af");
  const card = t(dark, "#0b1120", "#ffffff");

  return (
    <ThemeCtx.Provider value={{ dark, toggle: () => setDark((d) => !d) }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap');
        *{box-sizing:border-box;margin:0}
        input[type=range]{-webkit-appearance:none;appearance:none;background:${t(dark,"#1e293b","#d1d5db")};border-radius:4px;height:6px}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid #0ea5e9;background:${bg}}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:${bdr};border-radius:3px}
        ::selection{background:#0ea5e950}select option{background:${bg3}}
      `}</style>

      <SamplesBar onLoad={loadScenario} activeIdx={activeScenario} />

      <div style={{ minHeight: "100vh", background: bg, fontFamily: "'DM Sans',sans-serif", color: txt, display: "flex", paddingTop: 44 }}>

        {/* Toggle sidebar on small view */}
        <button onClick={() => setSidebar((s) => !s)} style={{ position: "fixed", bottom: 16, left: 16, zIndex: 50, width: 40, height: 40, borderRadius: 10, border: `1px solid ${bdr}`, background: bg2, color: txt2, cursor: "pointer", fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center" }}>
          {sidebar ? "◀" : "▶"}
        </button>

        {/* ─── SIDEBAR ─── */}
        {sidebar && (
          <div style={{ width: 280, flexShrink: 0, padding: "24px 18px", background: bg2, borderRight: `1px solid ${bdr2}`, height: "calc(100vh - 44px)", overflowY: "auto", display: "flex", flexDirection: "column", position: "sticky", top: 44 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20 }}>
              <div>
                <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: "0.2em", color: "#0ea5e9", textTransform: "uppercase", marginBottom: 6, fontFamily: "'JetBrains Mono',monospace" }}>AI Workforce Transformation</div>
                <div style={{ fontSize: 16, fontWeight: 700, color: txt, lineHeight: 1.3 }}>Client Intake &<br />Gap Assessment</div>
              </div>
              <button onClick={() => setDark((d) => !d)} style={{ width: 36, height: 36, borderRadius: 10, border: `1px solid ${bdr}`, background: bg3, color: txt2, cursor: "pointer", fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center" }}>
                {dark ? "☀️" : "🌙"}
              </button>
            </div>

            {/* Client fields */}
            <div style={{ marginBottom: 18 }}>
              {["company", "contact", "email"].map((k) => (
                <input key={k} type={k === "email" ? "email" : "text"} value={ci[k]} onChange={(e) => setCi((p) => ({ ...p, [k]: e.target.value }))} placeholder={k === "company" ? "Company name" : k === "contact" ? "Primary contact" : "Email"} style={{ width: "100%", padding: "8px 12px", marginBottom: 6, borderRadius: 7, border: `1px solid ${bdr}`, background: bg3, color: txt, fontSize: 12, outline: "none", boxSizing: "border-box" }} />
              ))}
            </div>

            {/* Gauge */}
            <div style={{ background: bg3, border: `1px solid ${band.color}30`, borderRadius: 14, padding: "16px 12px", marginBottom: 18 }}>
              <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: "0.15em", color: txt3, textTransform: "uppercase", marginBottom: 8, textAlign: "center", fontFamily: "'JetBrains Mono',monospace" }}>AI Readiness Index</div>
              <Gauge score={ri} />
              <div style={{ marginTop: 8, padding: "8px 10px", background: `${band.color}10`, borderRadius: 7, fontSize: 11, color: band.color, lineHeight: 1.4, textAlign: "center" }}>{band.rec}</div>
            </div>

            {/* Dimension mini bars */}
            <div style={{ marginBottom: 18 }}>
              {Object.entries(DIM_W).map(([k, { label, weight }]) => (
                <div key={k} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 7, padding: "6px 10px", borderRadius: 7, background: bg3 }}>
                  <div style={{ width: 26, height: 26, borderRadius: 6, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800, color: SL[scores[k]].color, background: `${SL[scores[k]].color}15`, fontFamily: "'JetBrains Mono',monospace" }}>{scores[k]}</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: txt }}>{label}</div>
                    <div style={{ fontSize: 9, color: txt3, fontFamily: "'JetBrains Mono',monospace" }}>{weight * 100}%</div>
                  </div>
                  <div style={{ width: 32, height: 3, borderRadius: 2, background: t(dark, "#1e293b", "#d1d5db"), overflow: "hidden" }}>
                    <div style={{ width: `${(scores[k] / 5) * 100}%`, height: "100%", background: SL[scores[k]].color, borderRadius: 2, transition: "all 0.3s" }} />
                  </div>
                </div>
              ))}
            </div>

            <button onClick={() => setView("summary")} style={{ width: "100%", padding: "11px 16px", borderRadius: 9, border: "1px solid #0ea5e9", background: view === "summary" ? "#0ea5e9" : "transparent", color: view === "summary" ? "#fff" : "#0ea5e9", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "'JetBrains Mono',monospace", letterSpacing: "0.05em", marginTop: "auto" }}>
              VIEW SUMMARY
            </button>
          </div>
        )}

        {/* ─── CONTENT ─── */}
        <div ref={ref} style={{ flex: 1, padding: "24px 32px", overflowY: "auto", maxHeight: "calc(100vh - 44px)" }}>
          {/* Progress */}
          <div style={{ display: "flex", gap: 3, marginBottom: 24 }}>
            {PHASES.map((ph, i) => {
              const active = view === "form" && i === phase;
              const c = cmap[ph.id] || 0;
              return (
                <button key={ph.id} onClick={() => nav(i)} style={{ flex: 1, padding: "10px 2px", border: "none", cursor: "pointer", background: active ? "#0ea5e9" : c > 0 ? `${SL[4].color}20` : t(dark, "#0f172a", "#f1f5f9"), borderRadius: 5, position: "relative", overflow: "hidden" }}>
                  {!active && c > 0 && <div style={{ position: "absolute", bottom: 0, left: 0, height: 3, width: `${c}%`, background: "#0ea5e9", borderRadius: 3 }} />}
                  <div style={{ fontSize: 9, fontWeight: 700, color: active ? "#fff" : txt3, fontFamily: "'JetBrains Mono',monospace" }}>P{ph.n}</div>
                </button>
              );
            })}
          </div>

          {view === "form" ? (
            <div>
              <div style={{ marginBottom: 28 }}>
                <div style={{ display: "inline-block", padding: "5px 12px", borderRadius: 16, background: "#0ea5e912", border: "1px solid #0ea5e940", fontSize: 10, fontWeight: 700, color: "#0ea5e9", fontFamily: "'JetBrains Mono',monospace", letterSpacing: "0.1em", marginBottom: 12 }}>PHASE {p.n} — {p.sub.toUpperCase()}</div>
                <h2 style={{ fontSize: 22, fontWeight: 700, color: txt, margin: "0 0 6px" }}>{p.title}</h2>
                <p style={{ fontSize: 13, color: txt3, margin: 0, lineHeight: 1.5 }}>{p.desc}</p>
              </div>

              {p.sections.map((s) => (
                <div key={s.id} style={{ marginBottom: 24, padding: "22px 24px", borderRadius: 14, background: card, border: `1px solid ${bdr2}` }}>
                  <h3 style={{ fontSize: 14, fontWeight: 700, color: txt, margin: "0 0 18px", paddingBottom: 12, borderBottom: `1px solid ${bdr}` }}>{s.title}</h3>
                  {s.fields.map((f) => <Field key={f.id} f={f} value={fd[f.id]} onChange={(v) => uf(f.id, v)} />)}
                  {s.scoring && <Slider value={scores[s.scoring.dim]} onChange={(v) => us(s.scoring.dim, v)} label={s.scoring.label} />}
                </div>
              ))}

              <div style={{ display: "flex", justifyContent: "space-between", paddingBottom: 32 }}>
                <button onClick={() => nav(Math.max(0, phase - 1))} disabled={phase === 0} style={{ padding: "10px 22px", borderRadius: 9, border: `1px solid ${bdr}`, background: "transparent", color: phase === 0 ? txt3 : txt2, fontSize: 13, fontWeight: 600, cursor: phase === 0 ? "default" : "pointer" }}>← Previous</button>
                <button onClick={() => phase < PHASES.length - 1 ? nav(phase + 1) : setView("summary")} style={{ padding: "10px 22px", borderRadius: 9, border: "none", background: "#0ea5e9", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>{phase < PHASES.length - 1 ? "Next Phase →" : "View Summary →"}</button>
              </div>
            </div>
          ) : (
            /* ─── SUMMARY ─── */
            <div>
              <div style={{ marginBottom: 28 }}>
                <div style={{ display: "inline-block", padding: "5px 12px", borderRadius: 16, background: "#8b5cf612", border: "1px solid #8b5cf640", fontSize: 10, fontWeight: 700, color: "#8b5cf6", fontFamily: "'JetBrains Mono',monospace", letterSpacing: "0.1em", marginBottom: 12 }}>ASSESSMENT SUMMARY</div>
                <h2 style={{ fontSize: 22, fontWeight: 700, color: txt, margin: "0 0 6px" }}>AI Readiness Report</h2>
                {ci.company && <p style={{ fontSize: 13, color: txt3, margin: 0 }}>Prepared for <span style={{ color: txt, fontWeight: 600 }}>{ci.company}</span>{ci.contact && ` · ${ci.contact}`}</p>}
              </div>

              {/* Score */}
              <div style={{ padding: 24, borderRadius: 14, background: card, border: `1px solid ${band.color}30`, marginBottom: 24, textAlign: "center" }}>
                <Gauge score={ri} />
                <div style={{ display: "inline-block", marginTop: 12, padding: "8px 20px", borderRadius: 9, background: `${band.color}12`, border: `1px solid ${band.color}30`, fontSize: 13, color: band.color, fontWeight: 600 }}>{band.rec}</div>
              </div>

              {/* Dimensions */}
              <div style={{ padding: "22px 24px", borderRadius: 14, background: card, border: `1px solid ${bdr2}`, marginBottom: 24 }}>
                <h3 style={{ fontSize: 14, fontWeight: 700, margin: "0 0 16px", paddingBottom: 12, borderBottom: `1px solid ${bdr}` }}>Dimension Scores</h3>
                {Object.entries(DIM_W).map(([k, { label, weight }]) => {
                  const s = scores[k]; const info = SL[s];
                  return (
                    <div key={k} style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10, padding: "10px 14px", borderRadius: 9, background: bg3 }}>
                      <div style={{ width: 36, height: 36, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, fontWeight: 800, color: info.color, background: `${info.color}12`, fontFamily: "'JetBrains Mono',monospace" }}>{s}</div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 13, fontWeight: 600 }}>{label}</div>
                        <div style={{ fontSize: 11, color: txt3 }}>{info.label} · {weight * 100}% · {Math.round(s * weight * 20)} pts</div>
                      </div>
                      <div style={{ width: 90, height: 5, borderRadius: 3, background: t(dark, "#1e293b", "#d1d5db"), overflow: "hidden" }}>
                        <div style={{ width: `${(s / 5) * 100}%`, height: "100%", background: info.color, borderRadius: 3 }} />
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Gaps */}
              {Object.entries(DIM_W).some(([k]) => scores[k] < 3) && (
                <div style={{ padding: "22px 24px", borderRadius: 14, background: card, border: `1px solid ${bdr2}`, marginBottom: 24 }}>
                  <h3 style={{ fontSize: 14, fontWeight: 700, margin: "0 0 16px", paddingBottom: 12, borderBottom: `1px solid ${bdr}` }}>Gap Analysis</h3>
                  {[
                    { dim: "business", signals: "No KPI-linked AI roadmap · Missing executive alignment · Budget tied to exploration" },
                    { dim: "technical", signals: "Weak data foundation · No production ML platform · Fragile architecture" },
                    { dim: "delivery", signals: "Slow deployment velocity · Governance immaturity · Compliance delays" },
                    { dim: "workforce", signals: "AI/ML skill shortages · Low autonomy · Cultural misalignment" },
                    { dim: "economic", signals: "High hiring failure risk · Long ramp times · Unclear ROI" },
                  ].filter((g) => scores[g.dim] < 3).map((g) => (
                    <div key={g.dim} style={{ marginBottom: 10, padding: "10px 14px", background: "#f59e0b08", border: "1px solid #f59e0b25", borderRadius: 8 }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: "#f59e0b", marginBottom: 4, fontFamily: "'JetBrains Mono',monospace" }}>{DIM_W[g.dim].label} ({scores[g.dim]}/5)</div>
                      <div style={{ fontSize: 12, color: txt2, lineHeight: 1.5 }}>{g.signals}</div>
                    </div>
                  ))}
                </div>
              )}

              {/* Responses */}
              <div style={{ padding: "22px 24px", borderRadius: 14, background: card, border: `1px solid ${bdr2}`, marginBottom: 24 }}>
                <h3 style={{ fontSize: 14, fontWeight: 700, margin: "0 0 16px", paddingBottom: 12, borderBottom: `1px solid ${bdr}` }}>Response Summary</h3>
                {PHASES.map((ph) => {
                  const filled = [];
                  ph.sections.forEach((s) => s.fields.forEach((f) => {
                    const v = fd[f.id];
                    if (v && (Array.isArray(v) ? v.length : v.length)) filled.push({ l: f.label, v: Array.isArray(v) ? v.join(", ") : v });
                  }));
                  if (!filled.length) return null;
                  return (
                    <div key={ph.id} style={{ marginBottom: 14 }}>
                      <div style={{ fontSize: 10, fontWeight: 700, color: "#0ea5e9", marginBottom: 6, fontFamily: "'JetBrains Mono',monospace" }}>Phase {ph.n}: {ph.title}</div>
                      {filled.map((ff, i) => (
                        <div key={i} style={{ padding: "7px 10px", marginBottom: 3, borderRadius: 6, background: bg3 }}>
                          <div style={{ fontSize: 10, color: txt3, marginBottom: 2 }}>{ff.l}</div>
                          <div style={{ fontSize: 12, color: txt2, lineHeight: 1.4 }}>{ff.v}</div>
                        </div>
                      ))}
                    </div>
                  );
                })}
                {Object.keys(fd).length === 0 && <div style={{ color: txt3, fontSize: 13, padding: 16, textAlign: "center" }}>No responses filled yet. Go back and fill in the form.</div>}
              </div>

              {/* Submit */}
              <div style={{ padding: "22px 24px", borderRadius: 14, background: card, border: `1px solid #0ea5e940`, marginBottom: 32 }}>
                {submitted ? (
                  <div style={{ textAlign: "center", padding: 16 }}>
                    <div style={{ fontSize: 32, marginBottom: 8 }}>✓</div>
                    <h3 style={{ fontSize: 16, fontWeight: 700, color: "#22c55e", margin: "0 0 6px" }}>Assessment Submitted</h3>
                    <p style={{ color: txt2, fontSize: 13, margin: 0 }}>Your intake assessment has been saved to the database.</p>
                  </div>
                ) : (
                  <>
                    <h3 style={{ fontSize: 14, fontWeight: 700, margin: "0 0 8px" }}>Submit Assessment</h3>
                    <p style={{ fontSize: 13, color: txt2, margin: "0 0 16px", lineHeight: 1.5 }}>Responses and scores will be stored in PostgreSQL for admin review.</p>
                    <div style={{ display: "flex", gap: 10 }}>
                      <button onClick={() => { setView("form"); nav(0); }} style={{ padding: "10px 22px", borderRadius: 9, border: `1px solid ${bdr}`, background: "transparent", color: txt2, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>← Back</button>
                      <button onClick={() => setSubmitted(true)} style={{ padding: "10px 22px", borderRadius: 9, border: "none", background: "#0ea5e9", color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer", flex: 1 }}>Submit Assessment</button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      </div>
    </ThemeCtx.Provider>
  );
}


// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));

// Hide loader
setTimeout(() => document.getElementById('loader')?.classList.add('hidden'), 300);
</script>

</body>
</html>

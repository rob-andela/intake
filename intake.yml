intake_assessment:
  metadata:
    sponsor_name:
      type: text
      label: "Name of the Executive Sponsor"
    team_size:
      type: number
      label: "Size of the team to assess/upskill"
    budget:
      type: text
      label: "Approved Budget Range"
    timeline:
      type: select
      label: "Timeline pressure for production delivery"
      options: [ "< 3 months", "3-6 months", "6-12 months", "12+ months" ]
  
  dimensions:
    strategic_alignment:
      weight: 0.33
      questions:
        - id: Q1
          type: multiple_choice
          text: "Executive Sponsorship & Budget — To what extent is the C-suite aligned and financially committed to AI upskilling?"
          options:
            - value: 1
              label: "No executive awareness; grassroots/individual requests only."
            - value: 2
              label: "Limited leadership interest; no dedicated budget."
            - value: 3
              label: "Department-level sponsorship with pilot budgets approved."
            - value: 4
              label: "VP/C-suite support with defined budget for initial rollouts."
            - value: 5
              label: "Board-level mandate with a multi-million, enterprise-wide L&D budget."
        - id: Q2
          type: multiple_choice
          text: "Defined AI Strategy — Is there a clear, business-aligned roadmap for AI integration?"
          options:
            - value: 1
              label: "No strategy; viewed as a short-term staffing fix."
            - value: 2
              label: "'Do AI' is the strategy; lacking clear business use cases."
            - value: 3
              label: "Strategy exists but is isolated to specific silos (e.g., only Supply Chain)."
            - value: 4
              label: "Clear 1–2 year roadmap for integrating AI into specific workflows/products."
            - value: 5
              label: "Comprehensive 3+ year strategy embedded into the core business model."
        - id: Q3
          type: multiple_choice
          text: "AI ROI & Metric Tracking — How will the organization measure the success of AI deployment and upskilling?"
          options:
            - value: 1
              label: "No metrics defined or considered."
            - value: 2
              label: "Vague goals like 'increase productivity' with no tracking mechanism."
            - value: 3
              label: "Basic tracking of tool adoption and login rates."
            - value: 4
              label: "Clear KPIs tied to time saved and operational efficiency."
            - value: 5
              label: "Advanced ROI models tracking revenue impact, cost reduction, and capability growth."

    data_and_technology:
      weight: 0.33
      questions:
        - id: Q4
          type: multiple_choice
          text: "Governed Data Architecture — How clean, centralized, and accessible is the organization's data?"
          options:
            - value: 1
              label: "Data is entirely fragmented in legacy on-prem systems or spreadsheets."
            - value: 2
              label: "Some digital records, but highly siloed with poor data hygiene."
            - value: 3
              label: "Data warehouses exist but lack unified governance and easy access."
            - value: 4
              label: "Centralized data lakes with role-based access control (RBAC)."
            - value: 5
              label: "Fully governed, AI-ready data infrastructure with real-time pipelines."
        - id: Q5
          type: multiple_choice
          text: "Cloud & Compute Readiness — Does the enterprise have the infrastructure to support AI workloads?"
          options:
            - value: 1
              label: "No cloud presence; strictly legacy on-prem."
            - value: 2
              label: "Basic cloud storage, but no scalable compute capabilities."
            - value: 3
              label: "Standard cloud infrastructure, but restricted or lacking AI/GPU provisioning."
            - value: 4
              label: "Solid hybrid-cloud setup capable of supporting modern AI tools."
            - value: 5
              label: "Enterprise agreements in place with major cloud/GPU providers for scale."
        - id: Q6
          type: multiple_choice
          text: "Security & API Integration — Are internal systems capable of secure API integrations with LLMs?"
          options:
            - value: 1
              label: "Closed legacy systems; no API capabilities."
            - value: 2
              label: "APIs exist but are highly brittle and undocumented."
            - value: 3
              label: "Standard integrations possible, but heavily bottlenecked by InfoSec."
            - value: 4
              label: "Modern microservices architecture ready for secure integrations."
            - value: 5
              label: "Zero-trust architecture with established patterns for secure LLM API usage."

    workforce_and_culture:
      weight: 0.34
      questions:
        - id: Q7
          type: multiple_choice
          text: "Baseline AI Literacy — What is the current level of AI understanding among the general workforce?"
          options:
            - value: 1
              label: "Zero awareness; high fear and skepticism."
            - value: 2
              label: "A few employees use public ChatGPT; widespread misconceptions exist."
            - value: 3
              label: "Basic understanding of generative AI, but mostly passive interest."
            - value: 4
              label: "High technical literacy; strong desire to adopt AI tools in daily work."
            - value: 5
              label: "Widespread daily usage of enterprise AI tools across multiple departments."
        - id: Q8
          type: multiple_choice
          text: "Agile Learning Culture — How adaptable is the workforce to learning new tools and processes?"
          options:
            - value: 1
              label: "Highly rigid; 'we've always done it this way' mentality."
            - value: 2
              label: "Bureaucratic; process changes take months or years to approve."
            - value: 3
              label: "Open to training, but historically slow to adopt new technologies."
            - value: 4
              label: "Adaptable workforce that embraces new software and workflows."
            - value: 5
              label: "Highly agile culture with frequent hackathons and continuous learning."
        - id: Q9
          type: multiple_choice
          text: "Change Management Communication — How effectively does leadership communicate technological change?"
          options:
            - value: 1
              label: "No structured communication; changes are perceived as sudden and disruptive."
            - value: 2
              label: "Infrequent, top-down announcements with little opportunity for feedback."
            - value: 3
              label: "Basic communication plans exist but are inconsistently executed."
            - value: 4
              label: "Regular, transparent updates with clear expectations for impacted teams."
            - value: 5
              label: "Proactive, two-way communication that builds enthusiasm and reduces resistance."

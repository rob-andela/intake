<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is your org ready for AI?</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --text: #0f172a;
            --muted: #64748b;
            --hint: #94a3b8;
        }
        body {
            margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg); color: var(--text); overflow-x: hidden;
            touch-action: pan-y;
        }
        .container {
            display: flex; flex-direction: column; justify-content: center;
            min-height: 100vh; max-width: 800px; margin: 0 auto; padding: 4rem 2rem;
            transition: opacity 0.3s ease-in-out;
            position: relative;
        }
        .fade-out { opacity: 0; }
        
        /* Setup UI */
        .setup-card { background: white; padding: 3rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); text-align: center; }
        .setup-card h1 { margin-top: 0; color: var(--primary); }
        .setup-card p { color: var(--muted); margin-bottom: 2rem; font-size: 1.1rem; }
        
        /* Question UI */
        .question-label { font-size: 1.5rem; color: var(--muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em;}
        .question-text { font-size: 2.5rem; font-weight: 600; margin-bottom: 2rem; line-height: 1.2; }
        .options { display: flex; flex-direction: column; gap: 1rem; }
        .option-btn {
            background: white; border: 2px solid #e2e8f0; border-radius: 8px;
            padding: 1.25rem; font-size: 1.25rem; text-align: left; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center;
        }
        .option-btn:hover, .option-btn.selected { border-color: var(--primary); background: #eff6ff; transform: translateX(5px); }
        .option-key { 
            background: #e2e8f0; color: var(--text); border-radius: 4px; 
            padding: 0.2rem 0.6rem; margin-right: 1rem; font-size: 1rem; font-weight: bold;
            border: 1px solid #cbd5e1;
        }
        .option-btn.selected .option-key { background: var(--primary); color: white; border-color: var(--primary); }
        
        /* Input UI */
        input[type="text"], input[type="number"] {
            width: 100%; padding: 1rem; font-size: 1.5rem; border: 2px solid #e2e8f0;
            border-radius: 8px; margin-bottom: 1rem; outline: none; box-sizing: border-box;
        }
        input:focus { border-color: var(--primary); }
        .btn-group { display: flex; gap: 1rem; margin-top: 1rem; align-items: center; }
        .action-btn {
            background: var(--primary); color: white; border: none; border-radius: 8px;
            padding: 1rem 2rem; font-size: 1.25rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem;
            transition: background 0.2s;
        }
        .action-btn:hover { background: #1d4ed8; }
        .action-btn.secondary { background: var(--muted); }
        .action-btn.secondary:hover { background: #475569; }

        /* Keyboard Hints */
        .keyboard-hints {
            margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e2e8f0;
            color: var(--hint); font-size: 0.9rem; display: flex; gap: 1.5rem; flex-wrap: wrap;
        }
        .key-hint { background: #e2e8f0; color: var(--muted); border-radius: 4px; padding: 0.1rem 0.4rem; font-weight: 600; font-family: monospace; font-size: 1rem;}

        /* Results & Toolbar UI */
        .toolbar { position: fixed; top: 1rem; right: 2rem; display: flex; gap: 1rem; z-index: 100; }
        .score-card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 2rem; }
        .score-large { font-size: 4rem; font-weight: bold; color: var(--primary); margin: 0.5rem 0; }
        
        /* Summary Box */
        .summary-box { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .summary-item { border-bottom: 1px solid #e2e8f0; padding: 1rem 0; display: flex; justify-content: space-between; align-items: flex-start;}
        .summary-item:last-child { border-bottom: none; }
        .summary-q { font-weight: 600; margin-bottom: 0.25rem; }
        .summary-a { color: var(--muted); }
        .edit-link { color: var(--primary); text-decoration: none; font-weight: bold; cursor: pointer; margin-left: 1rem; }
        .edit-link:hover { text-decoration: underline; }

        /* Progress Bar */
        #progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 6px; background: #e2e8f0; z-index: 100;}
        #progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
    </style>
</head>
<body>

    <div id="progress-container" style="display:none;"><div id="progress-bar"></div></div>
    
    <div class="toolbar" id="toolbar" style="display: none;">
        <button class="action-btn secondary" style="padding: 0.5rem 1rem; font-size: 1rem;" onclick="downloadJSON()">Save Profile (.json)</button>
        <input type="file" id="fileLoad" style="display: none;" accept=".json" onchange="loadJSON(event)">
        <button class="action-btn secondary" style="padding: 0.5rem 1rem; font-size: 1rem;" onclick="document.getElementById('fileLoad').click()">Load Profile (.json)</button>
        <button class="action-btn" id="btn-view-results" style="padding: 0.5rem 1rem; font-size: 1rem; display: none;" onclick="forceResults()">View Results</button>
    </div>

    <div id="setup" class="container">
        <div class="setup-card">
            <h1>AI Assessment Initialization</h1>
            <p>Please load the YAML configuration schema to begin.</p>
            <input type="file" id="yamlLoad" style="display: none;" accept=".yml,.yaml" onchange="loadYAMLConfig(event)">
            <button class="action-btn" onclick="document.getElementById('yamlLoad').click()">Load Schema (.yml)</button>
            <div style="margin-top: 1rem;">
                <button class="action-btn secondary" onclick="downloadSampleYAML()">Download Sample Schema (.yml)</button>
            </div>
        </div>
    </div>

    <div id="app" class="container" style="display: none;">
        </div>

    <script>
        // Data populated by YAML
        let questions = [];
        let weights = {};

        // Embedded sample YAML, used when the user wants a starter schema
        const SAMPLE_YAML = `
intake_assessment:
  metadata:
    client_name:
      type: text
      label: "Client name"
    sponsor_name:
      type: text
      label: "Executive sponsor name"
  dimensions:
    strategy:
      weight: 0.3
      questions:
        - id: strat_1
          type: multiple_choice
          selectionType: single
          text: "How clearly defined is your AI strategy?"
          options:
            - value: 1
              label: "No defined strategy"
            - value: 3
              label: "Ad-hoc, team-level initiatives"
            - value: 4
              label: "Documented strategy with some executive support"
            - value: 5
              label: "Enterprise-wide AI strategy with clear roadmap"
    data:
      weight: 0.4
      questions:
        - id: data_1
          type: multiple_choice
          selectionType: single
          text: "How mature is your data foundation for AI use cases?"
          options:
            - value: 1
              label: "Data is siloed and hard to access"
            - value: 3
              label: "Some centralized data, quality is inconsistent"
            - value: 4
              label: "Centralized data with basic governance"
            - value: 5
              label: "Well-governed, high-quality data platform"
    enablement:
      weight: 0.3
      questions:
        - id: enable_1
          type: multiple_choice
          selectionType: single
          text: "How prepared is your workforce to adopt AI-powered tools?"
          options:
            - value: 1
              label: "Little to no awareness or training"
            - value: 3
              label: "Targeted training for a few teams"
            - value: 4
              label: "Structured enablement program across multiple functions"
            - value: 5
              label: "Ongoing, role-based AI enablement at scale"
`;

        // State
        let currentIndex = 0;
        let isReviewMode = false;
        let payload = { client_id: 'cust_' + Math.floor(Math.random() * 90000 + 10000), metadata: {}, responses: {} };

        const setupDiv = document.getElementById('setup');
        const appDiv = document.getElementById('app');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const toolbar = document.getElementById('toolbar');
        const viewResultsBtn = document.getElementById('btn-view-results');

        // 1. YAML Loading & Parsing Logic
        function loadYAMLConfig(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const doc = jsyaml.load(e.target.result);
                    parseConfig(doc);
                    // Hide setup, show app
                    setupDiv.style.display = 'none';
                    appDiv.style.display = 'flex';
                    progressContainer.style.display = 'block';
                    renderCurrent();
                } catch (err) { alert("Invalid YAML schema file.\n\nError details: " + err.message); }
            };
            reader.readAsText(file);
        }

        function parseConfig(doc) {
            questions = [];
            weights = {};
            const intake = doc.intake_assessment;
            
            // A. Map Metadata Questions
            if (intake.metadata) {
                for (const [key, val] of Object.entries(intake.metadata)) {
                    let q = { 
                        id: key, 
                        dim: 'metadata', 
                        type: val.type === 'select' ? 'choice' : val.type, 
                        text: val.label 
                    };
                    
                    // Convert basic arrays from YAML into choice options
                    if (val.type === 'select' && Array.isArray(val.options)) {
                        q.options = val.options.map((opt) => ({ val: opt, label: opt }));
                        q.selectionType = 'single';
                    }
                    questions.push(q);
                }
            }

            // B. Map Dimension Questions & Weights
            if (intake.dimensions) {
                for (const [dimKey, dimData] of Object.entries(intake.dimensions)) {
                    weights[dimKey] = dimData.weight;
                    
                    if (Array.isArray(dimData.questions)) {
                        dimData.questions.forEach(q => {
                            questions.push({
                                id: q.id,
                                dim: dimKey,
                                type: q.type === 'multiple_choice' ? 'choice' : q.type,
                                selectionType: q.selectionType || 'single',
                                text: q.text,
                                options: q.options ? q.options.map(o => ({ val: o.value, label: o.label })) : []
                            });
                        });
                    }
                }
            }
        }

        // 2. Rendering Logic
        function renderCurrent() {
            if (currentIndex >= questions.length) {
                renderResults();
                return;
            }
            
            const q = questions[currentIndex];
            let html = `<div class="question-label">Question ${currentIndex + 1} of ${questions.length}</div>
                        <div class="question-text">${q.text}</div>`;

            let backBtn = currentIndex > 0 ? `<button class="action-btn secondary" onclick="goBack()">← Back</button>` : '';
            
            // Check if answered to enable Next button
            let hasAnswer = false;
            if (q.dim === 'metadata') hasAnswer = !!payload.metadata[q.id];
            else hasAnswer = payload.responses[q.id] !== undefined && payload.responses[q.id] !== '' && (!Array.isArray(payload.responses[q.id]) || payload.responses[q.id].length > 0);
            
            let nextBtn = hasAnswer ? `<button class="action-btn" onclick="goNext()">Next →</button>` : '';
            let hintsHtml = `<div class="keyboard-hints">`;
            
            if (currentIndex > 0) hintsHtml += `<span><span class="key-hint">←</span> (or swipe right) to go back</span>`;
            
            if (q.type === 'text' || q.type === 'number') {
                const val = payload.metadata[q.id] || '';
                html += `<input type="${q.type}" id="inputField" value="${val}" placeholder="Type your answer here...">
                         <div class="btn-group">${backBtn} <button class="action-btn" onclick="saveInputAndNext()">Save & Continue ↵</button> ${nextBtn}</div>`;
                hintsHtml += `<span><span class="key-hint">Enter ↵</span> to save</span>`;
            } else if (q.type === 'choice') {
                html += `<div class="options">`;
                
                let validKeys = [];
                q.options.forEach((opt, idx) => {
                    const char = String.fromCharCode(65 + idx); // A, B, C...
                    validKeys.push(`<span class="key-hint">${char}</span>`);
                    
                    let isSelected = false;
                    // Check where the answer lives (metadata vs responses)
                    let currentAns = q.dim === 'metadata' ? payload.metadata[q.id] : payload.responses[q.id];

                    if (q.selectionType === 'multiple') {
                        isSelected = Array.isArray(currentAns) && currentAns.includes(opt.val);
                    } else {
                        isSelected = currentAns === opt.val;
                    }

                    // For function call stringify the param if it's text
                    let valParam = typeof opt.val === 'string' ? `'${opt.val}'` : opt.val;

                    html += `<button class="option-btn ${isSelected ? 'selected' : ''}" onclick="handleChoiceSelection(${valParam}, ${idx})">
                                <span class="option-key">${char}</span> ${opt.label}
                             </button>`;
                });
                
                let advanceHint = q.selectionType === 'single' ? 'selects & advances' : 'selects (press Enter/Right to advance)';
                html += `</div><div class="btn-group" style="margin-top:2rem;">${backBtn} ${nextBtn}</div>`;
                hintsHtml += `<span>Type ${validKeys.join(' ')} ${advanceHint}</span>`;
                if (nextBtn) hintsHtml += `<span><span class="key-hint">→</span> (or swipe left) to skip to next</span>`;
            }

            hintsHtml += `</div>`;
            html += hintsHtml;

            animateTransition(html);
            progressBar.style.width = `${(currentIndex / questions.length) * 100}%`;
            toolbar.style.display = 'flex';
            if (isReviewMode) viewResultsBtn.style.display = 'inline-block';
            else viewResultsBtn.style.display = 'none';

            setTimeout(() => {
                const input = document.getElementById('inputField');
                if(input) {
                    input.focus();
                    input.setSelectionRange(input.value.length, input.value.length); 
                }
            }, 300);
        }

        function animateTransition(newHtml) {
            appDiv.classList.add('fade-out');
            setTimeout(() => {
                appDiv.innerHTML = newHtml;
                window.scrollTo(0,0);
                appDiv.classList.remove('fade-out');
            }, 150);
        }

        // 3. Navigation Controls
        function goBack() { if (currentIndex > 0) { currentIndex--; renderCurrent(); } }
        function goNext() { 
            const q = questions[currentIndex];
            if (q.type === 'text' || q.type === 'number') {
                const val = document.getElementById('inputField')?.value;
                if (!val && !payload.metadata[q.id]) return; 
                if (val) payload.metadata[q.id] = val;
            } else {
                if (q.dim === 'metadata' && payload.metadata[q.id] === undefined) return;
                if (q.dim !== 'metadata' && payload.responses[q.id] === undefined) return;
            }
            currentIndex++; 
            renderCurrent(); 
        }
        function forceResults() { currentIndex = questions.length; renderCurrent(); }

        function saveInputAndNext() {
            const val = document.getElementById('inputField').value;
            if(!val) return; 
            payload.metadata[questions[currentIndex].id] = val;
            goNext();
        }

        function handleChoiceSelection(value, index) {
            const q = questions[currentIndex];
            let store = q.dim === 'metadata' ? payload.metadata : payload.responses;

            if (q.selectionType === 'multiple') {
                let currentAns = store[q.id] || [];
                if (!Array.isArray(currentAns)) currentAns = [currentAns];
                if (currentAns.includes(value)) {
                    currentAns = currentAns.filter(v => v !== value);
                } else {
                    currentAns.push(value);
                }
                store[q.id] = currentAns;
                renderCurrent(); 
            } else {
                store[q.id] = value;
                goNext(); 
            }
        }
        
        function editQuestion(index) {
            currentIndex = index;
            renderCurrent();
        }

        // 4. Input Listeners (Keyboard & Swipe)
        document.addEventListener('keydown', (e) => {
            if (currentIndex >= questions.length || questions.length === 0) return;

            const q = questions[currentIndex];
            const isInputFocused = document.activeElement && document.activeElement.tagName === 'INPUT';

            if (e.key === 'ArrowLeft' && !isInputFocused) { goBack(); return; }
            if (e.key === 'ArrowRight' && !isInputFocused) { goNext(); return; }
            if ((q.type === 'text' || q.type === 'number') && e.key === 'Enter') { saveInputAndNext(); return; }

            if (q.type === 'choice' && !isInputFocused) {
                const keyCode = e.key.toUpperCase().charCodeAt(0);
                if (keyCode >= 65 && keyCode <= 90) { 
                    const optIndex = keyCode - 65;
                    if (q.options[optIndex]) {
                        handleChoiceSelection(q.options[optIndex].val, optIndex);
                    }
                }
                if (e.key === 'Enter') goNext();
            }
        });

        let touchstartX = 0; let touchendX = 0;
        document.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, false);
        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            if (currentIndex < questions.length && questions.length > 0) {
                if (touchendX < touchstartX - 50) goNext(); 
                if (touchendX > touchstartX + 50) goBack(); 
            }
        }, false);

        // 5. Results & Summary
        function calculateScore() {
            let dimSums = {};
            let dimCounts = {};
            Object.keys(weights).forEach(w => { dimSums[w] = 0; dimCounts[w] = 0; });

            for (const [qId, val] of Object.entries(payload.responses)) {
                const qDef = questions.find(q => q.id === qId);
                if (qDef && qDef.dim !== 'metadata' && !Array.isArray(val)) {
                    dimSums[qDef.dim] += val;
                    dimCounts[qDef.dim] += 1;
                }
            }

            let totalActiveWeight = 0;
            let indexScore = 0;

            Object.keys(weights).forEach(dim => {
                if (dimCounts[dim] > 0) {
                    indexScore += ((dimSums[dim] / dimCounts[dim]) * weights[dim]);
                    totalActiveWeight += weights[dim];
                }
            });

            if (totalActiveWeight > 0 && totalActiveWeight < 1) indexScore = indexScore / totalActiveWeight;

            const finalIndex = Math.round(indexScore * 20) || 0; 
            let band = "Foundational Risk";
            let rec = "No production AI path. Recommend AI foundation modernization.";
            if (finalIndex >= 80) { band = "Scalable Transformation"; rec = "Ready for multi-cohort workforce transformation."; }
            else if (finalIndex >= 60) { band = "Deployable"; rec = "Recommend production cohort deployment."; }
            else if (finalIndex >= 40) { band = "Emerging"; rec = "Pilot ready but unstable. Recommend small applied cohort."; }

            return { score: finalIndex, band, rec };
        }

        function renderResults() {
            isReviewMode = true;
            viewResultsBtn.style.display = 'none';
            progressBar.style.width = '100%';
            const results = calculateScore();
            payload.calculated_scores = { ai_readiness_index: results.score, readiness_band: results.band, recommendation: results.rec };

            let summaryHtml = '<div class="summary-box"><h2 style="margin-top:0;">Intake Summary</h2>';
            questions.forEach((q, idx) => {
                let ans = q.dim === 'metadata' ? payload.metadata[q.id] : payload.responses[q.id];
                let displayAns = ans !== undefined && ans !== '' ? ans : '<em>Not answered</em>';
                
                if(q.type === 'choice' && ans !== undefined) {
                    if (Array.isArray(ans)) {
                        displayAns = ans.map(v => q.options.find(o => o.val === v)?.label).join(', ');
                    } else {
                        let opt = q.options.find(o => o.val === ans);
                        if(opt) displayAns = opt.label;
                    }
                }
                
                summaryHtml += `
                    <div class="summary-item">
                        <div>
                            <div class="summary-q">${q.text}</div>
                            <div class="summary-a">${displayAns}</div>
                        </div>
                        <a class="edit-link" onclick="editQuestion(${idx})">Edit</a>
                    </div>`;
            });
            summaryHtml += '</div>';

            const html = `
                <div class="score-card">
                    <div class="question-label">Assessment Complete</div>
                    <div class="question-text">${payload.metadata.client_name || 'Client'} Readiness Overview</div>
                    <div>AI Readiness Index:</div>
                    <div class="score-large">${results.score} / 100</div>
                    <h3 style="margin-bottom: 0.5rem;">Band: ${results.band}</h3>
                    <p style="color: var(--muted); font-size: 1.1rem; margin-top: 0;">${results.rec}</p>
                </div>
                ${summaryHtml}
                <div style="margin-top: 2rem; text-align: center;">
                    <button class="action-btn" onclick="location.reload()">Start New Assessment</button>
                </div>
            `;
            animateTransition(html);
        }

        function downloadJSON() {
            const rawClient = payload.metadata.client_name || 'UnknownClient';
            const rawSponsor = payload.metadata.sponsor_name || 'UnknownSponsor';
            const fileName = `intake_${rawClient.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_${rawSponsor.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.json`;

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", fileName);
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
        }

        function loadJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    payload = JSON.parse(e.target.result);
                    // Ensure schema is loaded before rendering results
                    if(questions.length === 0) {
                        alert("Please load the YAML Schema first before loading a profile.");
                        return;
                    }
                    currentIndex = questions.length;
                    renderResults();
                } catch (err) { alert("Invalid JSON file."); }
            };
            reader.readAsText(file);
        }

        // 7. Sample YAML download helper
        function downloadSampleYAML() {
            const blob = new Blob([SAMPLE_YAML.trimStart()], { type: 'text/yaml;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'intake.sample.yml';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // 8. Auto-load intake.yml on page load if present
        window.addEventListener('load', () => {
            fetch('intake.yml', { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('intake.yml not found');
                    }
                    return response.text();
                })
                .then(text => {
                    try {
                        const doc = jsyaml.load(text);
                        parseConfig(doc);
                        setupDiv.style.display = 'none';
                        appDiv.style.display = 'flex';
                        progressContainer.style.display = 'block';
                        renderCurrent();
                    } catch (err) {
                        console.error('Failed to parse intake.yml:', err);
                        // Fall back to manual upload UI
                    }
                })
                .catch(err => {
                    console.info('No intake.yml found on load, waiting for user to provide one.', err);
                });
        });
    </script>
</body>
</html>

[build]
  publish = "."
  command = "echo 'Static files ready'"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/intake"
  to = "/.netlify/functions/intake"
  status = 200

[[redirects]]
  from = "/api/personas"
  to = "/.netlify/functions/personas"
  status = 200

[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

[context.production.environment]
  NODE_VERSION = "18"
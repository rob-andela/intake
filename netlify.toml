[build]
  publish = "."
  command = "echo 'Static files ready'"
  ignore = "false"

[functions]
  directory = "netlify/functions"
  included_files = ["*.json", "persona-*.json", "intake.json"]

[[redirects]]
  from = "/api/intake"
  to = "/.netlify/functions/intake"
  status = 200

[[redirects]]
  from = "/api/personas"
  to = "/.netlify/functions/personas"
  status = 200

[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

[context.production.environment]
  NODE_VERSION = "18"
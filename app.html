<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workforce Transformation — Assessment Platform</title>
    <meta name="description" content="Interactive AI readiness assessment platform with dynamic JSON schema loading and real-time scoring.">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color 0.2s ease;
        }

        /* Loading State */
        .loader {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            z-index: 1000;
        }

        .spinner {
            width: 2.5rem;
            height: 2.5rem;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Layout */
        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary);
        }

        .main-content {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            width: 100%;
        }

        /* Navigation */
        .nav-tabs {
            display: flex;
            gap: 0.25rem;
            background: var(--bg-tertiary);
            padding: 0.25rem;
            border-radius: var(--radius);
            margin-bottom: 2rem;
        }

        .nav-tab {
            flex: 1;
            padding: 0.75rem 1rem;
            background: transparent;
            border: none;
            border-radius: calc(var(--radius) - 0.25rem);
            cursor: pointer;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .nav-tab.active {
            background: var(--bg-primary);
            color: var(--text-primary);
            box-shadow: var(--shadow);
        }

        /* Cards */
        .card {
            background: var(--bg-primary);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .card-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .card-content {
            padding: 1.5rem;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.1);
        }

        .form-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5rem 1.5rem;
            padding-right: 2.5rem;
        }

        /* Question Styles */
        .question {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border-left: 4px solid var(--primary);
        }

        .question-text {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .question-options {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-button {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .option-button:hover {
            border-color: var(--primary-light);
            background: var(--bg-tertiary);
        }

        .option-button.selected {
            border-color: var(--primary);
            background: rgb(37 99 235 / 0.05);
        }

        .option-key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.75rem;
            height: 1.75rem;
            background: var(--bg-tertiary);
            border-radius: 50%;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .option-button.selected .option-key {
            background: var(--primary);
            color: white;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius);
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-light);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--text-muted);
        }

        /* Score Display */
        .score-display {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border-radius: var(--radius);
            margin-bottom: 2rem;
        }

        .score-value {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .score-label {
            font-size: 1.125rem;
            opacity: 0.9;
        }

        /* Progress */
        .progress-bar {
            width: 100%;
            height: 0.5rem;
            background: var(--bg-tertiary);
            border-radius: 0.25rem;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        /* Utilities */
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .hidden { display: none; }

        /* Typeform-style Question Interface */
        .typeform-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 0;
        }

        .question-progress {
            margin-bottom: 3rem;
        }

        .progress-text {
            text-align: center;
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        .typeform-question {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .question-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .question-dimension {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .question-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2.5rem;
            line-height: 1.2;
        }

        .typeform-option {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            margin-bottom: 1rem;
            position: relative;
            min-height: 4rem;
        }

        .typeform-option:hover {
            border-color: var(--primary-light);
            background: var(--bg-tertiary);
            transform: translateX(0.25rem);
        }

        .typeform-option.selected {
            border-color: var(--primary);
            background: rgb(37 99 235 / 0.08);
            transform: translateX(0.5rem);
        }

        .typeform-option.has-shortcut::before {
            content: '';
            position: absolute;
            left: -0.5rem;
            top: 50%;
            transform: translateY(-50%);
            width: 0.25rem;
            height: 0.25rem;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.6;
        }

        .typeform-option .option-key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            background: var(--bg-tertiary);
            border-radius: 0.375rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .typeform-option.selected .option-key {
            background: var(--primary);
            color: white;
        }

        .option-text {
            flex: 1;
            font-size: 1.125rem;
            color: var(--text-primary);
        }

        .option-selected {
            color: var(--primary);
            font-weight: 600;
            font-size: 1.25rem;
        }

        .typeform-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 3rem;
            gap: 1rem;
        }

        .floating-score {
            position: fixed;
            top: 6rem;
            right: 2rem;
            background: var(--primary);
            color: white;
            padding: 1rem;
            border-radius: 50%;
            width: 4rem;
            height: 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-lg);
            z-index: 50;
        }

        .floating-score .score-value {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1;
        }

        .floating-score .score-label {
            font-size: 0.6rem;
            opacity: 0.9;
            line-height: 1;
            margin-top: 0.125rem;
        }

        /* Keyboard Hints */
        .keyboard-hints {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.75rem 1.5rem;
            box-shadow: var(--shadow);
            z-index: 50;
        }

        .hints-content {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        kbd {
            display: inline-block;
            padding: 0.125rem 0.375rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 0.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 1rem;
            }
            
            .main-content {
                padding: 1rem;
            }
            
            .nav-tabs {
                flex-direction: column;
            }

            .question-title {
                font-size: 1.5rem;
            }

            .typeform-option {
                padding: 1rem;
                margin-bottom: 0.75rem;
            }

            .floating-score {
                right: 1rem;
                top: 5rem;
                width: 3.5rem;
                height: 3.5rem;
            }

            .floating-score .score-value {
                font-size: 1rem;
            }

            .keyboard-hints {
                bottom: 1rem;
                left: 1rem;
                right: 1rem;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div id="app" class="app-container">
        <!-- Loading State -->
        <div v-if="loading" class="loader">
            <div class="spinner"></div>
            <p class="text-muted">Loading Assessment Platform...</p>
        </div>

        <!-- Main Application -->
        <template v-else>
            <!-- Header -->
            <header class="header">
                <div class="header-content">
                    <div class="logo">
                        <span>🤖</span>
                        AI Assessment Platform
                    </div>
                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <button @click="toggleTheme" class="btn btn-secondary">
                            {{ darkMode ? '☀️' : '🌙' }}
                        </button>
                        <button @click="exportResults" class="btn btn-secondary" v-if="hasResults">
                            💾 Export
                        </button>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="main-content">
                <!-- Navigation Tabs -->
                <div class="nav-tabs">
                    <button 
                        class="nav-tab" 
                        :class="{ active: currentView === 'assessment' }"
                        @click="currentView = 'assessment'"
                    >
                        📋 Assessment
                    </button>
                    <button 
                        class="nav-tab" 
                        :class="{ active: currentView === 'results' }"
                        @click="currentView = 'results'"
                        v-if="hasResults"
                    >
                        📊 Results
                    </button>
                    <button 
                        class="nav-tab" 
                        :class="{ active: currentView === 'dashboard' }"
                        @click="currentView = 'dashboard'"
                    >
                        📈 Dashboard
                    </button>
                </div>

                <!-- Assessment View -->
                <div v-if="currentView === 'assessment'">
                    <!-- Schema Upload/Status -->
                    <div class="card mb-8" v-if="!assessmentSchema">
                        <div class="card-header">
                            <h2 class="card-title">Load Assessment Schema</h2>
                            <p class="text-muted">Load an assessment configuration from API or upload a file</p>
                        </div>
                        <div class="card-content">
                            <div class="form-group">
                                <label class="form-label">Load from API</label>
                                <div style="display: flex; gap: 0.75rem; margin-bottom: 1rem;">
                                    <button @click="loadSchemaFromAPI('intake.json')" class="btn btn-primary">
                                        📋 Load Intake Schema
                                    </button>
                                    <button @click="loadSchemaFromAPI('payload.json')" class="btn btn-secondary">
                                        📦 Load Payload Schema  
                                    </button>
                                    <button @click="discoverJsonFiles" class="btn btn-secondary">
                                        🔍 Discover Files
                                    </button>
                                </div>
                                <div v-if="availableFiles.length > 0" class="form-group">
                                    <label class="form-label">Available JSON Files</label>
                                    <select v-model="selectedFile" class="form-input form-select">
                                        <option value="">Select a file...</option>
                                        <option v-for="file in availableFiles" :key="file" :value="file">
                                            {{ file }}
                                        </option>
                                    </select>
                                    <button 
                                        @click="loadSchemaFromAPI(selectedFile)" 
                                        :disabled="!selectedFile"
                                        class="btn btn-primary"
                                        style="margin-top: 0.5rem;"
                                    >
                                        � Load Selected File
                                    </button>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Or Upload JSON File</label>
                                <input 
                                    type="file" 
                                    accept=".json"
                                    @change="handleSchemaUpload"
                                    class="form-input"
                                >
                            </div>
                        </div>
                    </div>

                    <!-- Assessment Form -->
                    <div v-if="assessmentSchema">
                        <!-- Progress -->
                        <div class="progress-bar">
                            <div class="progress-fill" :style="{ width: progress + '%' }"></div>
                        </div>
                        <p class="text-center text-muted mb-8">{{ progress.toFixed(0) }}% Complete</p>

                        <!-- Score Display -->
                        <div v-if="currentScore > 0" class="score-display">
                            <div class="score-value">{{ currentScore }}</div>
                            <div class="score-label">AI Readiness Index</div>
                        </div>

                        <!-- Metadata Questions -->
                        <div v-if="assessmentSchema.intake_assessment?.metadata" class="card mb-8">
                            <div class="card-header">
                                <h3 class="card-title">Project Information</h3>
                            </div>
                            <div class="card-content">
                                <div 
                                    v-for="(field, key) in assessmentSchema.intake_assessment.metadata" 
                                    :key="key"
                                    class="form-group"
                                >
                                    <label class="form-label">{{ field.label }}</label>
                                    <input 
                                        v-if="field.type === 'text' || field.type === 'number'"
                                        :type="field.type"
                                        v-model="responses.metadata[key]"
                                        class="form-input"
                                    >
                                    <select 
                                        v-else-if="field.type === 'select'"
                                        v-model="responses.metadata[key]"
                                        class="form-input form-select"
                                    >
                                        <option value="">Select...</option>
                                        <option 
                                            v-for="option in field.options" 
                                            :key="option"
                                            :value="option"
                                        >
                                            {{ option }}
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Typeform-style Single Question Display -->
                        <div v-if="assessmentSchema && allQuestions.length > 0" class="typeform-container">
                            <!-- Question Progress -->
                            <div class="question-progress">
                                <div class="progress-bar">
                                    <div class="progress-fill" :style="{ width: progress + '%' }"></div>
                                </div>
                                <p class="progress-text">
                                    {{ currentQuestionIndex + 1 }} of {{ allQuestions.length }} 
                                    • {{ progress.toFixed(0) }}% Complete
                                </p>
                            </div>

                            <!-- Current Question -->
                            <div v-if="currentQuestion" class="typeform-question">
                                <div class="question-header">
                                    <span class="question-number">{{ currentQuestionIndex + 1 }}</span>
                                    <span class="question-dimension">{{ currentQuestion.dimensionLabel }}</span>
                                </div>
                                
                                <h2 class="question-title">{{ currentQuestion.text }}</h2>
                                
                                <div class="question-options">
                                    <button
                                        v-for="(option, idx) in currentQuestion.options"
                                        :key="option.value"
                                        class="typeform-option"
                                        :class="{ 
                                            selected: responses.answers[currentQuestion.id] === option.value,
                                            'has-shortcut': idx < 9 
                                        }"
                                        @click="setAnswer(currentQuestion.id, option.value); nextQuestion()"
                                    >
                                        <span class="option-key">{{ idx + 1 }}</span>
                                        <span class="option-text">{{ option.label }}</span>
                                        <span v-if="responses.answers[currentQuestion.id] === option.value" class="option-selected">✓</span>
                                    </button>
                                </div>

                                <!-- Navigation -->
                                <div class="typeform-navigation">
                                    <button 
                                        v-if="canGoPrevious"
                                        @click="previousQuestion" 
                                        class="btn btn-secondary"
                                    >
                                        ← Previous
                                    </button>
                                    
                                    <button 
                                        v-if="canGoNext"
                                        @click="nextQuestion" 
                                        class="btn btn-primary"
                                        :disabled="!responses.answers[currentQuestion.id]"
                                    >
                                        Next →
                                    </button>
                                    
                                    <button 
                                        v-if="!canGoNext && progress >= 100"
                                        @click="completeAssessment" 
                                        class="btn btn-primary"
                                    >
                                        ✅ Complete Assessment
                                    </button>
                                </div>
                            </div>

                            <!-- Keyboard Shortcuts Help -->
                            <div v-if="showKeyboardHints" class="keyboard-hints">
                                <div class="hints-content">
                                    <p><kbd>1-9</kbd> Select option • <kbd>↑↓</kbd> Navigate • <kbd>Enter</kbd> Next • <kbd>Esc</kbd> Hide hints</p>
                                </div>
                            </div>

                            <!-- Score Display (Floating) -->
                            <div v-if="currentScore > 0" class="floating-score">
                                <div class="score-value">{{ currentScore }}</div>
                                <div class="score-label">AI Readiness</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Results View -->
                <div v-if="currentView === 'results' && hasResults" class="card">
                    <div class="card-header">
                        <h2 class="card-title">Assessment Results</h2>
                    </div>
                    <div class="card-content">
                        <div class="score-display">
                            <div class="score-value">{{ finalScore }}</div>
                            <div class="score-label">Final AI Readiness Score</div>
                        </div>

                        <h4 class="mb-4">Response Summary:</h4>
                        <div v-if="responses.metadata" class="mb-8">
                            <h5>Project Information</h5>
                            <ul>
                                <li v-for="(value, key) in responses.metadata" :key="key">
                                    <strong>{{ key.replace('_', ' ') }}:</strong> {{ value }}
                                </li>
                            </ul>
                        </div>

                        <div v-if="responses.answers">
                            <h5>Assessment Answers</h5>
                            <pre class="text-muted">{{ JSON.stringify(responses.answers, null, 2) }}</pre>
                        </div>
                    </div>
                </div>

                <!-- Dashboard View -->
                <div v-if="currentView === 'dashboard'" class="card">
                    <div class="card-header">
                        <h2 class="card-title">Assessment Dashboard</h2>
                        <p class="text-muted">Platform overview and statistics</p>
                    </div>
                    <div class="card-content">
                        <div class="text-center">
                            <p class="text-muted mb-4">Dashboard features coming soon...</p>
                            <p>Schema loaded: {{ assessmentSchema ? '✅' : '❌' }}</p>
                            <p>Questions answered: {{ Object.keys(responses.answers).length }}</p>
                            <p>Current score: {{ currentScore }}</p>
                        </div>
                    </div>
                </div>
            </main>
        </template>
    </div>

    <script>
        const { createApp } = Vue;

        // API Configuration
        const API_BASE_URL = location.hostname === 'localhost' 
            ? 'http://localhost:8080' 
            : '';

        createApp({
            data() {
                return {
                    loading: true,
                    currentView: 'assessment',
                    darkMode: false, // Light mode as default
                    assessmentSchema: null,
                    responses: {
                        metadata: {},
                        answers: {}
                    },
                    finalScore: 0,
                    availableFiles: [],
                    selectedFile: '',
                    currentQuestionIndex: 0,
                    allQuestions: [],
                    showKeyboardHints: true
                }
            },
            computed: {
                hasResults() {
                    return this.finalScore > 0;
                },
                progress() {
                    if (!this.assessmentSchema?.intake_assessment?.dimensions) return 0;
                    
                    let totalQuestions = 0;
                    let answeredQuestions = 0;

                    Object.values(this.assessmentSchema.intake_assessment.dimensions).forEach(dim => {
                        if (dim.questions) {
                            totalQuestions += dim.questions.length;
                            dim.questions.forEach(q => {
                                if (this.responses.answers[q.id] !== undefined) {
                                    answeredQuestions++;
                                }
                            });
                        }
                    });

                    return totalQuestions > 0 ? (answeredQuestions / totalQuestions) * 100 : 0;
                },
                currentScore() {
                    if (!this.assessmentSchema?.intake_assessment?.dimensions) return 0;
                    
                    let weightedScore = 0;
                    let totalWeight = 0;

                    Object.entries(this.assessmentSchema.intake_assessment.dimensions).forEach(([dimKey, dimension]) => {
                        if (dimension.questions && dimension.weight) {
                            let dimScore = 0;
                            let answeredCount = 0;

                            dimension.questions.forEach(question => {
                                const answer = this.responses.answers[question.id];
                                if (answer !== undefined) {
                                    dimScore += answer;
                                    answeredCount++;
                                }
                            });

                            if (answeredCount > 0) {
                                const avgDimScore = dimScore / answeredCount;
                                weightedScore += avgDimScore * dimension.weight;
                                totalWeight += dimension.weight;
                            }
                        }
                    });

                    return totalWeight > 0 ? Math.round((weightedScore / totalWeight) * 20) : 0;
                },
                currentQuestion() {
                    return this.allQuestions[this.currentQuestionIndex] || null;
                },
                canGoNext() {
                    return this.currentQuestionIndex < this.allQuestions.length - 1;
                },
                canGoPrevious() {
                    return this.currentQuestionIndex > 0;
                }
            },
            methods: {
                async loadSchemaFromAPI(fileName = 'intake.json') {
                    try {
                        const url = fileName === 'intake.json' 
                            ? `${API_BASE_URL}/api/intake`
                            : `${API_BASE_URL}/api/payload?file=${encodeURIComponent(fileName)}`;
                        
                        const response = await fetch(url);
                        if (response.ok) {
                            const schema = await response.json();
                            this.assessmentSchema = schema;
                            this.buildQuestionsList();
                            console.log('Schema loaded from API:', schema);
                        } else {
                            const error = await response.json();
                            if (error.available_files) {
                                console.log('Available JSON files:', error.available_files);
                            }
                            alert('Failed to load schema from API: ' + error.error);
                        }
                    } catch (error) {
                        console.error('Error loading schema:', error);
                        alert('Error loading schema from API: ' + error.message);
                    }
                },
                handleSchemaUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            try {
                                const schema = JSON.parse(e.target.result);
                                this.assessmentSchema = schema;
                                this.buildQuestionsList();
                                console.log('Schema loaded from file:', schema);
                            } catch (error) {
                                alert('Invalid JSON file');
                            }
                        };
                        reader.readAsText(file);
                    }
                },
                buildQuestionsList() {
                    this.allQuestions = [];
                    if (!this.assessmentSchema?.intake_assessment?.dimensions) return;
                    
                    Object.entries(this.assessmentSchema.intake_assessment.dimensions).forEach(([dimKey, dimension]) => {
                        if (dimension.questions) {
                            dimension.questions.forEach(question => {
                                this.allQuestions.push({
                                    ...question,
                                    dimension: dimKey,
                                    dimensionLabel: this.formatDimensionName(dimKey)
                                });
                            });
                        }
                    });
                },
                nextQuestion() {
                    if (this.currentQuestionIndex < this.allQuestions.length - 1) {
                        this.currentQuestionIndex++;
                    }
                },
                previousQuestion() {
                    if (this.currentQuestionIndex > 0) {
                        this.currentQuestionIndex--;
                    }
                },
                goToQuestion(index) {
                    if (index >= 0 && index < this.allQuestions.length) {
                        this.currentQuestionIndex = index;
                    }
                },
                handleKeyPress(event) {
                    if (!this.assessmentSchema || this.currentView !== 'assessment') return;
                    
                    const key = event.key;
                    const currentQuestion = this.allQuestions[this.currentQuestionIndex];
                    
                    if (!currentQuestion) return;
                    
                    // Number keys for selecting options
                    if (key >= '1' && key <= '9') {
                        const optionIndex = parseInt(key) - 1;
                        if (currentQuestion.options && currentQuestion.options[optionIndex]) {
                            this.setAnswer(currentQuestion.id, currentQuestion.options[optionIndex].value);
                            // Auto-advance to next question after selection
                            setTimeout(() => {
                                this.nextQuestion();
                            }, 300);
                        }
                    }
                    
                    // Navigation keys
                    switch (key) {
                        case 'Enter':
                            this.nextQuestion();
                            break;
                        case 'ArrowDown':
                            event.preventDefault();
                            this.nextQuestion();
                            break;
                        case 'ArrowUp':
                            event.preventDefault();
                            this.previousQuestion();
                            break;
                        case 'Escape':
                            this.showKeyboardHints = !this.showKeyboardHints;
                            break;
                    }
                },
                setAnswer(questionId, value) {
                    this.responses.answers[questionId] = value;
                },
                completeAssessment() {
                    this.finalScore = this.currentScore;
                    this.currentView = 'results';
                },
                exportResults() {
                    const exportData = {
                        timestamp: new Date().toISOString(),
                        score: this.finalScore,
                        responses: this.responses,
                        schema_version: this.assessmentSchema?.version || 'unknown'
                    };
                    
                    const blob = new Blob([JSON.stringify(exportData, null, 2)], { 
                        type: 'application/json' 
                    });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `ai-assessment-${Date.now()}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                },
                formatDimensionName(key) {
                    return key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                },
                async discoverJsonFiles() {
                    try {
                        const response = await fetch(`${API_BASE_URL}/api/payload?file=nonexistent.json`);
                        if (!response.ok) {
                            const error = await response.json();
                            if (error.available_files) {
                                this.availableFiles = error.available_files;
                                console.log('Discovered JSON files:', this.availableFiles);
                            }
                        }
                    } catch (error) {
                        console.error('Error discovering files:', error);
                    }
                },
                toggleTheme() {
                    this.darkMode = !this.darkMode;
                    document.documentElement.setAttribute('data-theme', this.darkMode ? 'dark' : 'light');
                },
                async initialize() {
                    // Try to load schema from API on startup
                    try {
                        await this.loadSchemaFromAPI();
                    } catch (error) {
                        console.log('No schema available from API, user will need to upload');
                    }
                    
                    this.loading = false;
                }
            },
            async mounted() {
                await this.initialize();
                
                // Add keyboard event listeners for Typeform-like navigation
                document.addEventListener('keydown', this.handleKeyPress);
            },
            beforeUnmount() {
                // Clean up event listeners
                document.removeEventListener('keydown', this.handleKeyPress);
            }
        }).mount('#app');
    </script>
</body>
</html>
